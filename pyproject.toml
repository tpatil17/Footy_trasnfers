[project]
name = "scouting"
version = "0.1.0"
description = "Transfer scouting engine: tactical-profile-driven recruitment shortlist"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["scouting*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
